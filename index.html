 class="back" data-action="kakao">‹ 友だち</button><h1>${p.id?'人物を編集':'人物を登録'}</h1><p class="hint">ここで登録した人物はInstagramにも反映されます。設定内容は後でAIに渡せるよう保存します。</p><form id="personForm"><label class="muted">名前<input class="field" name="name" value="${esc(p.name||'')}" placeholder="名前" required maxlength="40"></label><label class="muted">アイコン絵文字<input class="field" name="emoji" value="${esc(p.emoji||'')}" placeholder="例：🧑🏻" maxlength="8"></label><label class="muted">プロフィール紹介<textarea class="field" name="bio" rows="3">${esc(p.bio||'')}</textarea></label><label class="muted">年齢<input class="field" type="number" name="age" value="${esc(p.age||'')}" placeholder="年齢"></label><label class="muted">誕生日<input class="field" type="text" name="birthday" value="${esc(p.birthday||'')}" placeholder="誕生日"></label><label class="muted">職業・学校<input class="field" type="text" name="occupation" value="${esc(p.occupation||'')}" placeholder="職業・学校"></label><label class="muted">身長・外見<input class="field" type="text" name="height" value="${esc(p.height||'')}" placeholder="身長・外見"></label><label class="muted">趣味・好き嫌い<textarea class="field" name="hobbies" rows="3" placeholder="趣味・好き嫌い">${esc(p.hobbies||'')}</textarea></label><label class="muted">性格・価値観<textarea class="field" name="personality" rows="3" placeholder="性格・価値観">${esc(p.personality||'')}</textarea></label><label class="muted">返信速度<select class="field" name="replySpeed"><option value="instant" ${p.replySpeed==='instant'?'selected':''}>即レス（数秒）</option><option value="normal" ${p.replySpeed==='normal'?'selected':''}>普通（1〜5分）</option><option value="slow" ${p.replySpeed==='slow'?'selected':''}>遅い（10〜30分）</option><option value="random" ${p.replySpeed==='random'?'selected':''}>ランダム</option></select></label><label class="muted">話し方・返信の癖<textarea class="field" name="speech" rows="3" placeholder="話し方・返信の癖">${esc(p.speech||'')}</textarea></label><label class="muted">恋愛観<textarea class="field" name="romance" rows="3" placeholder="恋愛観">${esc(p.romance||'')}</textarea></label><label class="muted">他の人物との関係性<textarea class="field" name="relationships" rows="3" placeholder="他の人物との関係性">${esc(p.relationships||'')}</textarea></label><label class="muted">生活リズム<textarea class="field" name="routine" rows="3" placeholder="生活リズム">${esc(p.routine||'')}</textarea></label><label class="muted">過去の出来事・背景<textarea class="field" name="history" rows="3" placeholder="過去の出来事・背景">${esc(p.history||'')}</textarea></label><label class="muted">その他の詳細設定（長文OK）<textarea class="field" name="extra" rows="3" placeholder="その他の詳細設定（長文OK）">${esc(p.extra||'')}</textarea></label><button class="primary">${p.id?'変更を保存':'人物を登録'}</button></form></section>`}else if(view==='chat'){let p=state.people.find(p=>p.id===current);if(!p){nav('kakao');return}h=`<section class="page"><button class="back" data-action="kakao">‹ 友だち</button><h1>${esc(p.name)}</h1><button class="back" data-action="editperson">✎ 人物設定を編集</button><div class="chat">${(state.messages[current]||[]).map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><form id="chatForm" class="composer"><input class="field" name="message" placeholder="メッセージ" autocomplete="off" required><button class="primary">送信</button></form><p class="hint">返信速度の設定は保存されます。AI接続までは返信は自動生成されません。</p></section>`}else if(view==='photos'){h=`<section class="page"><button class="back" data-action="home">‹ ホーム</button><h1>写真</h1><label class="primary" style="display:inline-block">＋ 写真を追加<input type="file" id="photoInput" accept="image/*" multiple hidden></label><p class="hint">写真はこのブラウザに保存します。大量の画像は保存容量を超える場合があります。</p><div class="gridphotos">${state.photos.map((src,i)=>`<img src="${src}" alt="保存した写真 ${i+1}" data-photo="${i}">`).join('')}</div></section>`}else if(view==='instagram'){h=`<section class="page"><button class="back" data-action="home">‹ ホーム</button><div class="ighead"><h1 style="font-family:Georgia,serif;font-style:italic">Instagram</h1><button class="primary" data-action="newpost">＋ 投稿</button></div><div class="tabs"><button data-action="stories">ストーリーズ</button><button data-action="dmList">DM ✉</button><button data-action="feed" class="${igTab==='feed'?'active':''}">フィード</button><button data-action="accounts" class="${igTab==='accounts'?'active':''}">人物</button></div>${igTab==='accounts'?state.people.map(p=>`<div class="row"><span class="avatar">${esc(p.emoji||'👤')}</span><div><b>${esc(p.name)}</b><p class="muted">${esc(p.bio)}</p></div></div>`).join('')||'<p>カカオトークで人物を登録してね。</p>':state.posts.map((p,i)=>`<article class="post"><b>${esc(p.author)}</b><button class="back" data-editpost="${i}" style="float:right">編集</button>${p.image?`<img src="${p.image}" alt="投稿写真">`:''}<p>${esc(p.text)}</p><button data-like="${i}" class="back">${state.likes[i]?'♥':'♡'} いいね</button><button class="back" data-comment="${i}"> 💬 コメント (${(state.comments[i]||[]).length})</button><div>${(state.comments[i]||[]).map(x=>`<p class="muted">${esc(x)}</p>`).join('')}</div></article>`).join('')||'<p>まだ投稿がありません。</p>'}</section>`}else if(view==='newpost'){h=`<section class="page"><button class="back" data-action="instagram">‹ Instagram</button><h1>新しい投稿</h1><form id="postForm"><select name="author" class="field"><option value="自分">自分</option>${state.people.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select><textarea class="field" name="text" rows="4" placeholder="キャプションを入力"></textarea><label class="muted">投稿日時<input type="datetime-local" class="field" name="postedAt" value="${appNow().toISOString().slice(0,16)}"></label><label>写真を選ぶ（任意）<select name="photo" class="field"><option value="">写真なし</option>${state.photos.map((_,i)=>`<option value="${i}">写真 ${i+1}</option>`).join('')}</select></label><button class="primary">投稿する</button></form></section>`}else if(view==='dmList'){h=`<section class="page"><button class="back" data-action="instagram">‹ Instagram</button><h1>メッセージ</h1>${state.people.map(p=>`<button class="row" data-dm-person="${p.id}"><span class="avatar">${esc(p.emoji||'👤')}</span><span><b>${esc(p.name)}</b><br><span class="muted">${esc((state.dm[p.id]||[]).at(-1)?.text||'メッセージを送信')}</span></span></button>`).join('')||'<p>カカオトークから人物を追加してね。</p>'}</section>`}else if(view==='dmChat'){let p=state.people.find(p=>p.id===current);if(!p){nav('dmList');return}h=`<section class="page"><button class="back" data-action="dmList">‹ DM</button><h1>${esc(p.name)}</h1><div class="chat">${(state.dm[current]||[]).map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><form id="dmForm" class="composer"><input class="field" name="message" placeholder="メッセージ" required autocomplete="off"><button class="primary">送信</button></form><p class="hint">AI返信はまだ未接続です。</p></section>`}else if(view==='settings'){h=`<section class="page"><button class="back" data-action="home">‹ ホーム</button><h1>仮想時間</h1><p class="hint">このシミュレーター内の時計と日付を変更できます。実際のiPhoneの時間は変わりません。</p><form id="timeForm"><label class="muted">時間のモード<select class="field" name="mode"><option value="real" ${state.timeMode==='real'?'selected':''}>現実の時間</option><option value="virtual" ${state.timeMode==='virtual'?'selected':''}>仮想時間</option></select></label><label class="muted">仮想日時<input class="field" type="datetime-local" name="virtualTime" value="${esc(state.virtualTime)}"></label><button class="primary">保存する</button></form></section>`}else if(view==='stories'){h=`<section class="page"><button class="back" data-action="instagram">‹ Instagram</button><h1>ストーリーズ</h1><button class="primary" data-action="newstory">＋ ストーリー作成</button><p class="hint">仮想時間で24時間経過すると一覧から消えます。</p>${state.stories.filter(s=>appNow().getTime()-new Date(s.at).getTime()<86400000 && appNow().getTime()>=new Date(s.at).getTime()).map(s=>`<article class="post"><b>${esc(s.author)}</b><p>${esc(s.text)}</p>${s.image?`<img src="${s.image}" alt="ストーリー画像">`:''}</article>`).join('')||'<p>表示できるストーリーズはありません。</p>'}</section>`}else if(view==='newstory'){h=`<section class="page"><button class="back" data-action="stories">‹ ストーリーズ</button><h1>ストーリーを作成</h1><form id="storyForm"><label>投稿者<select class="field" name="author"><option>自分</option>${state.people.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></label><textarea class="field" name="text" rows="3" placeholder="テキスト"></textarea><label>写真<select class="field" name="photo"><option value="">なし</option>${state.photos.map((_,i)=>`<option value="${i}">写真 ${i+1}</option>`).join('')}</select></label><button class="primary">投稿する</button></form></section>`}else if(view==='photoDetail'){let src=state.photos[Number(current)];h=`<section class="page"><button class="back" data-action="photos">‹ 写真</button><img src="${src}" alt="写真" style="width:100%;max-height:70dvh;object-fit:contain"><button class="row" data-action="deletephoto">この写真を削除</button></section>`}$('content').innerHTML=h;clock();bind()}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='unlock')nav('home');else if(a==='addperson'){current=null;nav('addperson')}else if(a==='editperson')nav('addperson');else if(a==='disabled'){}else if(a==='feed'||a==='accounts'){igTab=a;nav('instagram')}else nav(a)});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.person);nav('chat')});document.querySelectorAll('[data-dm-person]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.dmPerson);nav('dmChat')});document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>{let t=prompt('コメントを入力');if(t&&t.trim()){(state.comments[b.dataset.comment]??=[]).push('自分: '+t.trim());save();render()}});document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.photo);nav('photoDetail')});document.querySelectorAll('[data-editpost]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.editpost),p=state.posts[i];let v=prompt('キャプションを編集',p.text);if(v!==null){p.text=v;save();render()}});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{state.likes[b.dataset.like]=!state.likes[b.dataset.like];save();render()});let tf=$('timeForm');if(tf)tf.onsubmit=e=>{e.preventDefault();let d=new FormData(tf);state.timeMode=String(d.get('mode'));state.virtualTime=String(d.get('virtualTime'));save();nav('home')};let sf=$('storyForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let d=new FormData(sf),idx=String(d.get('photo'));state.stories.unshift({author:String(d.get('author')),text:String(d.get('text')),image:idx===''?'':state.photos[Number(idx)],at:appNow().toISOString()});save();nav('stories')};let f=$('personForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),name=String(d.get('name')).trim();if(!name)return;let keys=['emoji','bio','age','birthday','occupation','height','hobbies','personality','speech','romance','relationships','routine','history','extra','replySpeed'];let data={name};for(let k of keys)data[k]=String(d.get(k)||'').trim();let existing=state.people.find(p=>p.id===current);if(existing)Object.assign(existing,data);else state.people.push({id:Date.now(),...data});save();nav('kakao')};f=$('chatForm');if(f)f.onsubmit=e=>{e.preventDefault();let t=String(new FormData(f).get('message')).trim();if(!t)return;(state.messages[current]??=[]).push({text:t,mine:true});save();render();let c=document.querySelector('.page');c.scrollTop=c.scrollHeight};f=$('postForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.posts.unshift({author:String(d.get('author')),text:String(d.get('text')),image:d.get('photo')===''?'':state.photos[Number(d.get('photo'))],postedAt:String(d.get('postedAt')||'')});save();igTab='feed';nav('instagram')};f=$('dmForm');if(f)f.onsubmit=e=>{e.preventDefault();let t=String(new FormData(f).get('message')).trim();if(!t)return;(state.dm[current]??=[]).push({text:t,mine:true});save();render();let c=document.querySelector('.page');c.scrollTop=c.scrollHeight};let pi=$('photoInput');if(pi)pi.onchange=async e=>{for(let file of Array.from(e.target.files).slice(0,5)){if(!file.type.startsWith('image/'))continue;let url=await resize(file);state.photos.push(url)}save();render()};let del=document.querySelector('[data-action=deletephoto]');if(del)del.onclick=()=>{if(confirm('この写真を削除しますか？')){state.photos.splice(Number(current),1);save();nav('photos')}}}
function resize(file){return new Promise((resolve,reject)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let scale=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.68))};im.onerror=reject;im.src=u})}let startY=0;document.addEventListener('touchstart',e=>{if(view==='lock')startY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(view==='lock'&&startY-e.changedTouches[0].clientY>70)nav('home')},{passive:true});render();

function igActiveStories(){return state.stories.filter(s=>{let delta=appNow().getTime()-new Date(s.at).getTime();return delta>=0&&delta<86400000})}
function igBottom(){return `<nav class="ig-bottom"><button data-ig="feed" aria-label="フィード">⌂</button><button data-ig="explore" aria-label="人物を探す">⌕</button><button data-ig="newpost" aria-label="新規投稿">⊞</button><button data-ig="dmList" aria-label="DM">✉</button><button data-ig="profile" data-id="me" aria-label="プロフィール">◉</button></nav>`}
function igFeedHTML(){let stories=igActiveStories();return `<section class="page ig-page"><header class="ig-top"><span class="ig-brand">Instagram</span><span><button class="ig-action" data-ig="newstory" aria-label="ストーリー追加">⊕</button><button class="ig-action" data-ig="dmList" aria-label="DM">✉</button></span></header><div class="ig-stories"><button class="ig-story" data-ig="newstory"><span class="ig-ring" style="background:#ddd"><span class="ig-ring-inner">＋</span></span>ストーリー</button>${stories.map((st,i)=>`<button class="ig-story" data-ig="storyview" data-index="${i}"><span class="ig-ring"><span class="ig-ring-inner">${st.image?`<img src="${st.image}" alt="">`:esc(igAllAccounts().find(a=>a.name===st.author)?.emoji||'👤')}</span></span>${esc(st.author)}</button>`).join('')}</div>${state.posts.map((post,i)=>{let a=igAllAccounts().find(x=>x.name===post.author);return `<article class="ig-post"><div class="ig-post-header">${igAvatar(a)}<b>${esc(post.author)}</b><button class="ig-action" style="margin-left:auto;font-size:17px" data-editpost="${i}">⋯</button></div>${post.image?`<div class="ig-post-media"><img src="${post.image}" alt="投稿画像"></div>`:`<div class="ig-post-media" style="padding:20px;text-align:center;white-space:pre-wrap">${esc(post.text||'投稿')}</div>`}<div class="ig-post-actions"><button data-like="${i}" aria-label="いいね">${state.likes[i]?'❤️':'♡'}</button><button data-comment="${i}" aria-label="コメント">♧</button><button data-ig="dmList" aria-label="シェア">➤</button></div><div class="ig-post-text"><b>${esc(post.author)}</b> ${esc(post.text)}${(state.comments[i]||[]).map(x=>`<p class="muted">${esc(x)}</p>`).join('')}</div></article>`}).join('')||'<p style="text-align:center;padding:30px 10px;color:#777">まだ投稿がありません。＋から最初の投稿を作ってみよう。</p>'}${igBottom()}</section>`}
function igProfileHTML(){let p=igPerson(igPersonId)||igAllAccounts()[0],mine=igPersonId==='me',posts=state.posts.map((post,i)=>({...post,i})).filter(x=>x.author===p.name);return `<section class="page ig-page"><header class="ig-top"><button class="back" data-ig="feed">‹ 戻る</button><b>@${esc(igHandle(p))}</b><button class="ig-action" data-ig="explore">☰</button></header><div class="ig-profile-head"><span style="font-size:49px;background:#eee;border-radius:50%;height:85px;width:85px;display:grid;place-items:center">${esc(p.emoji||'👤')}</span><div class="ig-profile-stats"><span><b>${posts.length}</b>投稿</span><span><b>${p.followers||0}</b>フォロワー</span><span><b>${p.following||0}</b>フォロー中</span></div></div><b>${esc(p.name)}</b><div class="ig-profile-bio">${esc(p.bio||'')}</div>${mine?`<button class="ig-inline" data-ig="newpost">＋ 投稿を作成</button>`:`<button class="ig-inline" data-ig="dm" data-id="${p.id}">メッセージ</button>`}<hr style="border:0;border-top:1px solid #ddd;margin:22px 0 2px"><div class="ig-profile-grid">${posts.map(x=>`<button data-ig="feed" aria-label="投稿を見る">${x.image?`<img src="${x.image}" alt="投稿">`:`<span>${esc(x.text.slice(0,35))}</span>`}</button>`).join('')}</div>${igBottom()}</section>`}
function igExploreHTML(){return `<section class="page ig-page"><header class="ig-top"><button class="back" data-ig="feed">‹ 戻る</button><b>アカウント</b><span></span></header><p class="hint">カカオトークで登録した人物がここにも表示されます。</p>${igAllAccounts().map(p=>`<button class="row" data-ig="profile" data-id="${p.id}">${igAvatar(p)}<span><b>${esc(p.name)}</b><br><span class="muted">@${esc(igHandle(p))}</span></span><span style="margin-left:auto">›</span></button>`).join('')}${igBottom()}</section>`}
function igStoryHTML(){let s=igActiveStories()[igStoryIndex];if(!s)return `<section class="page ig-page"><button class="back" data-ig="feed">‹ 戻る</button><p>ストーリーはありません。</p></section>`;return `<section class="page ig-page"><button class="back" data-ig="feed">× 閉じる</button><div class="ig-story-stage"><div class="ig-story-progress"></div><b>${esc(s.author)}</b>${s.image?`<img src="${s.image}" alt="ストーリー画像">`:''}<p>${esc(s.text)}</p><button class="ig-inline" data-ig="nextstory">次へ →</button></div></section>`}
const originalRenderV10=render;
render=function(){if(view==='instagram'||view==='igProfile'||view==='igExplore'||view==='igStory'){if(view==='instagram')$('content').innerHTML=igFeedHTML();if(view==='igProfile')$('content').innerHTML=igProfileHTML();if(view==='igExplore')$('content').innerHTML=igExploreHTML();if(view==='igStory')$('content').innerHTML=igStoryHTML();clock();bind();bindInstagramV11()}else{originalRenderV10();if(view==='newpost'||view==='newstory'){let form=$('postForm')||$('storyForm');if(form){let select=form.querySelector('[name="author"]');if(select)select.insertAdjacentHTML('afterend','<p class="hint">人物データはカカオトークと共通です。</p>')}}}};
function bindInstagramV11(){document.querySelectorAll('[data-ig]').forEach(el=>el.onclick=()=>{let a=el.dataset.ig;if(a==='feed')nav('instagram');else if(a==='explore')nav('igExplore');else if(a==='profile'){igPersonId=el.dataset.id;nav('igProfile')}else if(a==='storyview'){igStoryIndex=Number(el.dataset.index);nav('igStory')}else if(a==='nextstory'){let count=igActiveStories().length;if(igStoryIndex+1<count){igStoryIndex++;render()}else nav('instagram')}else if(a==='dm'){current=Number(el.dataset.id);nav('dmChat')}else nav(a)});document.querySelectorAll('[data-like]').forEach(el=>el.onclick=()=>{let i=el.dataset.like;state.likes[i]=!state.likes[i];save();render()});document.querySelectorAll('[data-comment]').forEach(el=>el.onclick=()=>{let i=el.dataset.comment,t=prompt('コメントを入力');if(t?.trim()){(state.comments[i]??=[]).push('自分: '+t.trim());save();render()}});document.querySelectorAll('[data-editpost]').forEach(el=>el.onclick=()=>{let p=state.posts[Number(el.dataset.editpost)],v=prompt('キャプションを編集',p.text);if(v!==null){p.text=v;save();render()}});
}
// Ver.12: recover visible interface if stored data or an app view fails.
window.addEventListener('error',function(e){
  const target=document.getElementById('content');
  if(target&&!target.children.length){
    target.innerHTML='<section class="recovery"><h2>画面の読み込みに問題が発生しました</h2><button id="retry-home">ホーム画面を開く</button></section>';
    const btn=document.getElementById('retry-home');
    if(btn)btn.onclick=()=>{view='home';try{render()}catch(err){alert('再読み込みしてください: '+err.message)}};
  }
});
try{render()}catch(e){
  console.error('Initial render failed',e);
  view='home';
  try{originalRenderV10()}catch(err){
    document.getElementById('content').innerHTML='<section class="recovery"><h2>読み込みエラー</h2><p>Safariで再読み込みしてください。</p></section>';
  }
}

/* Ver.13: photo, Instagram, Kakao integration; original local data retained. */
(function(){
const oldRender=render;
render=function(){
  oldRender();
  const page=document.querySelector('.page');
  if(view==='kakao'||view==='chat')page?.classList.add('v13-kakao');
  if(view==='photos'&&page){
    const grid=page.querySelector('.gridphotos');
    if(grid&&!state.photos.length)grid.insertAdjacentHTML('beforebegin','<p class="hint">写真を追加するとInstagramの投稿・ストーリーでも選べます。</p>');
  }
  if(view==='chat'||view==='dmChat'){
    const p=state.people.find(x=>String(x.id)===String(current));
    if(p&&page){
      const title=page.querySelector('h1');
      if(title)title.insertAdjacentHTML('afterend',`<p class="muted">${esc(p.bio||'')} · Instagramと共通の人物</p>`);
    }
  }
  if(view==='newpost'||view==='newstory'){
    const form=document.querySelector('#postForm,#storyForm');
    if(form){
      const photoSelect=form.querySelector('[name="photo"]');
      if(photoSelect){
        const wrapper=document.createElement('div');
        wrapper.className='v13-card';
        wrapper.innerHTML='<b>写真ライブラリ</b><p class="hint">写真アプリに保存した写真を選べます。</p><div id="v13-preview"></div>';
        photoSelect.parentElement.after(wrapper);
        const update=()=>{const idx=photoSelect.value;wrapper.querySelector('#v13-preview').innerHTML=idx===''?'写真なし':`<img alt="選択した写真" src="${state.photos[Number(idx)]}">`};
        photoSelect.addEventListener('change',update);update();
      }
    }
  }
  if(view==='igProfile'&&page){
    const p=igPerson(igPersonId);
    if(p){
      const bio=page.querySelector('.ig-profile-bio');
      if(bio)bio.insertAdjacentHTML('afterend',`<div class="v13-toolbar"><button data-v13-chat="${esc(p.id)}">カカオトークで会話</button></div>`);
    }
  }
  if(view==='instagram'&&page){
    page.querySelectorAll('.ig-post-header').forEach(header=>{
      const name=header.querySelector('b')?.textContent;
      const p=state.people.find(x=>x.name===name);
      if(p){
        header.querySelector('b').onclick=()=>{igPersonId=p.id;nav('igProfile')};
        header.querySelector('.ig-avatar').onclick=()=>{igPersonId=p.id;nav('igProfile')};
      }
    });
  }
  document.querySelectorAll('[data-v13-chat]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.v13Chat);nav('chat')});
};
try{render()}catch(e){console.error('Ver.13 refresh',e)}
})();
</script></body></html>
